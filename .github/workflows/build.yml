name: Build desktop artifacts

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos-build:
    name: macOS Universal build
    runs-on: macos-14
    timeout-minutes: 45
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run source checks and unit tests
        run: npm test

      - name: Build unsigned Universal macOS packages
        run: npm run dist:mac

      - name: Verify arm64 and x86_64 slices
        shell: bash
        run: |
          set -euo pipefail
          display_helper="native/macos/.build/lanextend-vdisplay"
          input_helper="native/macos/.build/lanextend-input"
          test -f "$display_helper"
          test -f "$input_helper"
          lipo "$display_helper" -verify_arch arm64 x86_64
          lipo "$input_helper" -verify_arch arm64 x86_64

          set +e
          probe_output="$("$input_helper" --probe)"
          probe_status=$?
          set -e
          test "$probe_status" -eq 0 -o "$probe_status" -eq 2
          printf '%s\n' "$probe_output" | grep -q '"event":"probe"'

          app_binary="$(find release -type f -path '*/LanExtend.app/Contents/MacOS/LanExtend' -print -quit)"
          test -n "$app_binary"
          lipo "$app_binary" -verify_arch arm64 x86_64
          file "$display_helper" "$input_helper" "$app_binary"

      - name: Upload macOS packages
        uses: actions/upload-artifact@v4
        with:
          name: LanExtend-macOS-universal-${{ github.sha }}
          path: |
            release/*.dmg
            release/*.zip
          if-no-files-found: error
          retention-days: 14

  windows-build:
    name: Windows x64 build
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run source checks and unit tests
        run: npm test

      - name: Verify Windows input and file clipboard helper
        shell: pwsh
        run: |
          $lines = @(
            '{"command":"clipboard-read","requestId":"ci-clipboard"}',
            '{"command":"quit"}'
          )
          $output = $lines | & powershell.exe -NoLogo -NoProfile -NonInteractive -STA -ExecutionPolicy Bypass -File native/windows/lanextend-input.ps1
          if ($LASTEXITCODE -ne 0) { throw "Windows helper exited with code $LASTEXITCODE" }
          $messages = @($output | ForEach-Object { $_ | ConvertFrom-Json })
          $ready = $messages | Where-Object { $_.event -eq 'ready' } | Select-Object -First 1
          $response = $messages | Where-Object { $_.requestId -eq 'ci-clipboard' } | Select-Object -First 1
          if (-not $ready.trusted) { throw 'Windows helper did not report ready' }
          if (-not $response.ok) { throw "Clipboard probe failed: $($response.error)" }
          if ($null -eq $response.revision) { throw 'Clipboard revision was not returned' }

      - name: Build unsigned Windows packages
        run: npm run dist:win

      - name: Upload Windows packages
        uses: actions/upload-artifact@v4
        with:
          name: LanExtend-Windows-x64-${{ github.sha }}
          path: |
            release/*.exe
            release/*.zip
          if-no-files-found: error
          retention-days: 14
